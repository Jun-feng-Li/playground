name: ProofLoop round 002 independent intake agent

on:
  push:
    branches: [proofloop/round002-intake]
    paths: [.github/workflows/proofloop-round002-agent.yml]
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  intake-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the official Copilot CLI
        run: |
          mkdir -p agent-receipt
          npm install -g @github/copilot
          copilot --version > agent-receipt/cli-version.txt
      - name: Execute only the assigned ProofLoop intake role
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          out = root / 'agent-receipt'
          task = root / 'research/rational_sextuple_two_integers/round_002/INTAKE_TASK.md'
          text = task.read_text()
          prompt = text + '\n\nTransport instruction: this is a fresh independent intake-only session. All needed input is above. Do not invoke tools or access files, environment variables, or network resources. Instead of creating files, return the complete output.json content as your final answer, without Markdown fences. Session identity and transcript are captured separately by the host. Do not assert any later role, mathematical result or controller acceptance.\n'
          (out / 'prompt.txt').write_text(prompt)
          isolated = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proofloop-intake-context'
          isolated.mkdir(exist_ok=True)
          argv = ['copilot', '-p', prompt, '--no-ask-user', '--no-custom-instructions', '--output-format=json', '--share=' + str(out/'session.md')]
          started = time.time()
          rc = None
          failure = None
          try:
              proc = subprocess.run(argv, cwd=isolated, capture_output=True, timeout=240)
              stdout, stderr, rc = proc.stdout, proc.stderr, proc.returncode
          except subprocess.TimeoutExpired as exc:
              stdout, stderr = exc.stdout or b'', exc.stderr or b''
              failure = 'timeout_without_automatic_retry'
          # Never archive authentication material, even on provider failure.
          secret = os.environ.get('GITHUB_TOKEN', '').encode()
          if secret:
              stdout, stderr = stdout.replace(secret,b'[REDACTED]'), stderr.replace(secret,b'[REDACTED]')
          (out/'stdout.jsonl').write_bytes(stdout)
          (out/'stderr.txt').write_bytes(stderr)
          session = out/'session.md'
          if session.exists() and secret:
              session.write_bytes(session.read_bytes().replace(secret,b'[REDACTED]'))
          receipt = {'schema':'external-agent-attempt-v1','run_id':'run_2dde091dc2bc4733918344c78de56b06','job_id':'job_13cad664eb8f41d09be85595b8ab9634','generation':1,'role':'briefing_builder','scope':'problem_intake','input_sha256':'6251c240119a4165cff268daaf055b4484956a408f2cc6a4d3066173f72920dc','workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'source_commit':os.environ['GITHUB_SHA'],'backend':'github-copilot-cli','requested_model':'provider-default','prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),'stdout_sha256':hashlib.sha256(stdout).hexdigest(),'exit_code':rc,'failure':failure,'elapsed_seconds':round(time.time()-started,3),'controller_submission_performed':False,'independent_model_execution_confirmed':False,'confirmation_note':'Inspect provider transcript and response before attesting execution. Launching a process alone does not establish a model response.'}
          (out/'attempt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'exit_code':rc,'failure':failure,'stdout_bytes':len(stdout),'stderr_bytes':len(stderr)}))
          if rc != 0:
              raise SystemExit(1)
          PY
      - name: Preserve actual execution output or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofloop-round002-intake-${{ github.run_id }}
          path: agent-receipt/
          retention-days: 7
          if-no-files-found: warn
